name: Deploy CHENLE UNIVERSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import existing website once
        if: hashFiles('package.json') == ''
        run: |
          git clone --depth 1 https://github.com/Veronica-J-118/chenleuniverse.git /tmp/chenle-source
          rsync -a --exclude='.git' --exclude='.github' /tmp/chenle-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import CHENLE UNIVERSE website"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run check
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_API_ORIGIN: https://chenleland-fans-1122.nearbybay4.chatgpt.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
